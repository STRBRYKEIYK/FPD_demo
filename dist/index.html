<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPD Demo</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon-CeL-LwwC.svg" />
    <script type="module" crossorigin src="./assets/index-CDrSWvQD.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vendor-D_TJI4Qs.js">
    <link rel="modulepreload" crossorigin href="./assets/excel-zip-vendor-Cg56Rv6R.js">
    <link rel="modulepreload" crossorigin href="./assets/html2canvas-vendor-BD1F0tPC.js">
    <link rel="modulepreload" crossorigin href="./assets/jspdf-vendor-Db6c8AXY.js">
    <link rel="modulepreload" crossorigin href="./assets/icons-vendor-nj_bYq0i.js">
    <link rel="modulepreload" crossorigin href="./assets/router-vendor-B1Pb4mAx.js">
    <link rel="stylesheet" crossorigin href="./assets/index-BOhCLkKW.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function setupPagesFallbackBootstrap() {
        let fallbackStarted = false;

        function loadModuleScript(src) {
          return new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.type = "module";
            script.src = src;
            script.onload = resolve;
            script.onerror = () => {
              script.remove();
              reject(new Error(`Failed to load module: ${src}`));
            };
            document.body.appendChild(script);
          });
        }

        function getAssetCandidates(assetPath, distIndexUrl) {
          const absoluteUrl = new URL(assetPath, distIndexUrl).toString();
          const candidates = [absoluteUrl];
          if (absoluteUrl.includes("/assets/")) {
            candidates.push(absoluteUrl.replace("/assets/", "/dist/assets/"));
          }
          if (absoluteUrl.includes("/dist/assets/")) {
            candidates.push(absoluteUrl.replace("/dist/assets/", "/assets/"));
          }
          return [...new Set(candidates)];
        }

        async function resolveFirstAvailableUrl(candidates) {
          for (const candidate of candidates) {
            try {
              const response = await fetch(candidate, { method: "HEAD", cache: "no-store" });
              if (response.ok) {
                return candidate;
              }
            } catch (_error) {
              // Try the next candidate URL.
            }
          }
          return candidates[0];
        }

        async function loadFirstAvailableModule(candidates) {
          let lastError = null;
          for (const candidate of candidates) {
            try {
              await loadModuleScript(candidate);
              return;
            } catch (error) {
              lastError = error;
            }
          }
          if (lastError instanceof Error) {
            throw lastError;
          }
          throw new Error("No module candidate could be loaded");
        }

        function showBootstrapError(message) {
          const root = document.getElementById("root");
          if (!root) {
            return;
          }
          root.innerHTML = `<div style="max-width:700px;margin:48px auto;padding:20px;border:1px solid #e5e7eb;border-radius:12px;font-family:Segoe UI,Arial,sans-serif;line-height:1.5;background:#fff;"><h2 style="margin-top:0;">App failed to load</h2><p style="margin:0 0 8px;">The deployment is missing the expected build files.</p><p style="margin:0;color:#6b7280;font-size:14px;">${message}</p></div>`;
        }

        async function bootstrapFromDistBuild() {
          const distIndexUrl = new URL("./dist/index.html", window.location.href).toString();
          const response = await fetch(distIndexUrl, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Unable to fetch ${distIndexUrl} (status ${response.status})`);
          }

          const html = await response.text();
          const doc = new DOMParser().parseFromString(html, "text/html");

          const stylesheetNodes = doc.querySelectorAll('link[rel="stylesheet"][href]');
          for (const node of stylesheetNodes) {
            const href = node.getAttribute("href");
            if (!href) {
              continue;
            }

            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = await resolveFirstAvailableUrl(getAssetCandidates(href, distIndexUrl));
            document.head.appendChild(link);
          }

          const moduleScript = doc.querySelector('script[type="module"][src]');
          const src = moduleScript?.getAttribute("src");
          if (!src) {
            throw new Error("No module script found in dist/index.html");
          }

          await loadFirstAvailableModule(getAssetCandidates(src, distIndexUrl));
        }

        window.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            if (fallbackStarted || !(target instanceof HTMLScriptElement)) {
              return;
            }

            const failedSrc = target.src || "";
            if (!failedSrc.includes("/src/main.jsx")) {
              return;
            }

            fallbackStarted = true;
            bootstrapFromDistBuild().catch((error) => {
              console.error("Fallback bootstrap failed:", error);
              showBootstrapError(error instanceof Error ? error.message : "Unknown bootstrap error");
            });
          },
          true,
        );
      })();
    </script>
  </body>
</html>
