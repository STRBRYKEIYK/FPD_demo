  </head>
  <body>
    <div id="root"></div>
    <script>
      (function setupPagesFallbackBootstrap() {
        let fallbackStarted = false;

        function loadModuleScript(src) {
          return new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.type = "module";
            script.src = src;
            script.onload = resolve;
            script.onerror = () => {
              script.remove();
              reject(new Error(`Failed to load module: ${src}`));
            };
            document.body.appendChild(script);
          });
        }

        function remapToDistAssets(assetPath, distIndexUrl) {
          const absoluteUrl = new URL(assetPath, distIndexUrl).toString();
          if (absoluteUrl.includes("/dist/assets/")) {
            return absoluteUrl;
          }
          if (absoluteUrl.includes("/assets/")) {
            return absoluteUrl.replace("/assets/", "/dist/assets/");
          }
          return absoluteUrl;
        }

        function showBootstrapError(message) {
          const root = document.getElementById("root");
          if (!root) {
            return;
          }
          root.innerHTML = `<div style="max-width:700px;margin:48px auto;padding:20px;border:1px solid #e5e7eb;border-radius:12px;font-family:Segoe UI,Arial,sans-serif;line-height:1.5;background:#fff;"><h2 style="margin-top:0;">App failed to load</h2><p style="margin:0 0 8px;">The deployment is missing the expected build files.</p><p style="margin:0;color:#6b7280;font-size:14px;">${message}</p></div>`;
        }

        async function bootstrapFromDistBuild() {
          const distIndexUrl = new URL("./dist/index.html", window.location.href).toString();
          const response = await fetch(distIndexUrl, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Unable to fetch ${distIndexUrl} (status ${response.status})`);
          }

          const html = await response.text();
          const doc = new DOMParser().parseFromString(html, "text/html");

          const stylesheetNodes = doc.querySelectorAll('link[rel="stylesheet"][href]');
          stylesheetNodes.forEach((node) => {
            const href = node.getAttribute("href");
            if (!href) {
              return;
            }
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = remapToDistAssets(href, distIndexUrl);
            document.head.appendChild(link);
          });

          const moduleScript = doc.querySelector('script[type="module"][src]');
          const src = moduleScript?.getAttribute("src");
          if (!src) {
            throw new Error("No module script found in dist/index.html");
          }

          await loadModuleScript(remapToDistAssets(src, distIndexUrl));
        }

        window.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            if (fallbackStarted || !(target instanceof HTMLScriptElement)) {
              return;
            }

            const failedSrc = target.src || "";
            if (!failedSrc.includes("/src/main.jsx")) {
              return;
            }

            fallbackStarted = true;
            bootstrapFromDistBuild().catch((error) => {
              console.error("Fallback bootstrap failed:", error);
              showBootstrapError(error instanceof Error ? error.message : "Unknown bootstrap error");
            });
          },
          true,
        );
      })();
    </script>
  </body>
</html>
